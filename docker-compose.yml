version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: furnihub-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: Robin@Singh@755321
      MYSQL_DATABASE: e_commerce
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pRobin@Singh@755321"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: furnihub-backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/e_commerce?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: Robin@Singh@755321
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      JWT_SECRET: FurniHubSecretKeyForJWTTokenGeneration2024SecureRandomValue
      JWT_EXPIRATION: 2592000000
      RAZORPAY_KEY_ID: rzp_test_TLJ4wDlknTTeqx
      RAZORPAY_KEY_SECRET: OaxbN5tf8PlOXaNG0WZ8FduM
      RAZORPAY_MODE: test
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  frontend:
    build: ./frontend
    container_name: furnihub-frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mysql_data:
