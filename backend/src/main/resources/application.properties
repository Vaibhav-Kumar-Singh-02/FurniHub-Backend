# Application
spring.application.name=FurniHub

# MySQL Database
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/e_commerce?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Robin@Singh@755321}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# SQL Initialization (optional - for fresh DB setup)
spring.sql.init.mode=never
spring.sql.init.schema-locations=classpath:schema.sql

# JWT
jwt.secret=${JWT_SECRET:FurniHubSecretKeyForJWTTokenGeneration2024SecureRandomValue}
jwt.expiration=2592000000

# Server
server.port=${PORT:8080}

# File upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Razorpay (Test Mode)
razorpay.key-id=${RAZORPAY_KEY_ID:rzp_test_TLJ4wDlknTTeqx}
razorpay.key-secret=${RAZORPAY_KEY_SECRET:OaxbN5tf8PlOXaNG0WZ8FduM}
razorpay.mode=test

# Cookie Configuration
app.cookie.name=auth_token
app.cookie.max-age=0
app.cookie.path=/
app.cookie.http-only=true
app.cookie.secure=${COOKIE_SECURE:false}
app.cookie.same-site=Lax

# CORS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:3001}

# Logging
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.com.furnihub=DEBUG
